name: Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests & API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Verify SDK
        run: yarn verify

  package:
    name: Package dry run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Validate package contents
        run: yarn check:package

  expo:
    name: Expo package & autolinking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install locally packed SDK
        run: yarn expo-example:install
      - name: Typecheck Expo example
        run: npm --prefix examples/expo-example run typecheck
      - name: Prebuild and verify native autolinking
        run: yarn expo-example:prebuild && yarn expo-example:verify-autolinking

  android:
    name: Android bare RN build
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.1.12297006
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache turborepo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-
      - name: Check turborepo cache
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --filter=oms-client-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")
          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> "$GITHUB_ENV"
          fi
      - name: Install JDK
        if: env.turbo_cache_hit != '1'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Install Android NDK
        if: env.turbo_cache_hit != '1'
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"; then
              exit 0
            fi
            rm -rf "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" "$ANDROID_HOME/.temp"
            sleep 10
          done
          exit 1
      - name: Cache Gradle
        if: env.turbo_cache_hit != '1'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('examples/sdk-example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build example
        env:
          JAVA_OPTS: -XX:MaxHeapSize=6g
        run: yarn turbo run build:android --filter=oms-client-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  ios:
    name: iOS bare RN build
    runs-on: macos-latest
    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Cache turborepo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-
      - name: Check turborepo cache
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --filter=oms-client-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")
          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> "$GITHUB_ENV"
          fi
      - name: Select Xcode
        if: env.turbo_cache_hit != '1'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Setup Ruby
        if: env.turbo_cache_hit != '1'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.4.9
      - name: Install CocoaPods dependencies
        if: env.turbo_cache_hit != '1'
        working-directory: examples/sdk-example
        run: |
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios
      - name: Build example
        run: yarn turbo run build:ios --filter=oms-client-react-native-sdk-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"
