name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript & TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:javascript-typescript

  kotlin:
    name: Kotlin
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    env:
      ANDROID_NDK_VERSION: 27.1.12297006
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Install Android NDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"
      - name: Build Android example
        env:
          JAVA_OPTS: -XX:MaxHeapSize=6g
        run: yarn sdk-example build:android
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:java-kotlin

  swift:
    name: Swift
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: swift
          build-mode: manual
      - name: Setup
        uses: ./.github/actions/setup
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 26
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.4.9
      - name: Install CocoaPods dependencies
        working-directory: examples/sdk-example
        run: |
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios
      - name: Build iOS example
        run: yarn sdk-example build:ios
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:swift
