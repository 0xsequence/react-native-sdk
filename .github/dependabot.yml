version: 2
updates:
  # Root package (library + workspaces)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # Expo example (standalone npm project)
  - package-ecosystem: npm
    directory: /examples/expo-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # Ruby and CocoaPods tooling for the bare React Native examples
  - package-ecosystem: bundler
    directory: /examples/sdk-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: bundler
    directory: /examples/trails-actions-example
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  # Gradle wrappers and example build tooling. Native OMS SDK pins remain coordinated manually.
  - package-ecosystem: gradle
    directory: /examples/sdk-example/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: gradle
    directory: /examples/trails-actions-example/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
